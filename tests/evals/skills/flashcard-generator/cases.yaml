version: 1
scenarios:
  - id: flashcard-normal-anki-cards
    category: normal
    prompt: |
      Turn this onboarding note into Anki-ready flashcards:

      Idempotency prevents duplicate side effects when clients retry requests
      after timeouts. Payment APIs commonly require an idempotency key so the
      server can recognize a retry and return the original result instead of
      charging again.
    expected_behavior: >
      Produces source-grounded flashcards for durable recall, extracts learning
      objectives before card generation, uses atomic prompts, includes at
      least one application or failure-mode card, includes canonical JSON, and
      avoids broad prompts such as "Explain idempotency."

  - id: flashcard-indirect-memory-prompts
    category: indirect-trigger
    prompt: |
      I need memory prompts for spaced repetition from these project notes:

      Retry-safe payment endpoints need an idempotency key so repeated client
      requests do not create duplicate charges.
    expected_behavior: >
      Recognizes the indirect flashcard request, creates source-grounded
      retention cards rather than a quiz or summary, includes learning
      objectives and a compact knowledge map, and returns reviewable cards plus
      canonical JSON.

  - id: flashcard-cloze-contrast
    category: normal
    prompt: |
      Make cloze and contrast cards from this:

      Authentication verifies who a user is. Authorization determines what that
      user is allowed to do.
    expected_behavior: >
      Produces cloze cards only where context is strong, produces a contrast
      card for authentication versus authorization, preserves the distinction
      accurately, and avoids duplicating equivalent cards unnecessarily.

  - id: flashcard-source-grounding-boundary
    category: edge
    prompt: |
      Create flashcards from this note and add any important related facts you
      know:

      OAuth authorization codes are exchanged for tokens.
    expected_behavior: >
      Grounds factual cards in the provided source, marks any inferred or
      external context clearly or avoids adding it, does not fabricate
      unsupported details, and keeps cards answerable without hidden context.

  - id: flashcard-non-trigger-summary
    category: non-trigger
    prompt: |
      Summarize this article in one paragraph:

      Retrieval practice can improve long-term learning when learners actively
      recall information instead of rereading notes.
    expected_behavior: >
      Does not treat a generic one-paragraph summary request as a primary
      flashcard-generation task. If no other skill is requested, the response
      should remain a summary workflow rather than producing cards.

  - id: flashcard-both-output-request
    category: edge
    prompt: |
      Create flashcards and a quiz from this codebase overview:

      The importer normalizes CSV rows, validates required columns, and writes
      accepted records to the staging table.
    expected_behavior: >
      Preserves separate flashcard and quiz contracts. It may share learning
      objectives and a compact knowledge map, but flashcard output remains
      atomic retrieval practice and quiz output remains a separate assessment
      section with its own canonical JSON payload.
