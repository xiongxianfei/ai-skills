version: 1
scenarios:
  - id: quiz-normal-diagnostic
    category: normal
    prompt: |
      Create an 8-question diagnostic quiz from this onboarding note:

      Idempotency prevents duplicate side effects when clients retry requests
      after timeouts. Payment APIs commonly require an idempotency key so the
      server can recognize a retry and return the original result instead of
      charging again.
    expected_behavior: >
      Produces a quiz blueprint, extracts learning objectives, includes a mix
      of recall, comprehension, application, and diagnosis items, includes an
      answer key and rationales, and keeps questions source-grounded.

  - id: quiz-indirect-comprehension-check
    category: indirect-trigger
    prompt: |
      Can you make a quick comprehension check from this chapter excerpt?

      A retry can repeat an operation. Idempotency makes retrying safe by
      ensuring the repeated request has the same effect as the original
      request.
    expected_behavior: >
      Recognizes the indirect quiz request, creates assessment questions rather
      than flashcards or a summary, includes a blueprint or compact objective
      mapping, and returns questions with answer key, rationales, feedback, and
      canonical JSON.

  - id: quiz-mcq-distractor-quality
    category: normal
    prompt: |
      Make 4 multiple-choice questions from this:

      A retry can repeat an operation. Idempotency makes retrying safe by
      ensuring the repeated request has the same effect as the original
      request.
    expected_behavior: >
      Uses clear stems, provides one best answer per MCQ unless multiple-select
      is requested, uses plausible distractors that are clearly wrong, explains
      why each option is right or wrong, and avoids grammatical clues and "all
      of the above" by default.

  - id: quiz-unsupported-material-boundary
    category: edge
    prompt: |
      Create a quiz from this short note and include advanced questions:

      OAuth is used for authorization.
    expected_behavior: >
      Does not invent unsupported advanced facts as if they are source-grounded,
      either limits questions to source-supported material or clearly marks
      inferred context, and avoids ambiguous questions with multiple defensible
      answers.

  - id: quiz-non-trigger-rewrite
    category: non-trigger
    prompt: |
      Rewrite this document to be clearer:

      The deployment pipeline has a build stage, a test stage, and a release
      approval stage.
    expected_behavior: >
      Does not treat a generic rewrite request as a primary quiz-generation
      task. If no assessment wording is present, the response should remain a
      rewriting workflow rather than producing quiz questions.

  - id: quiz-both-output-request
    category: edge
    prompt: |
      Create flashcards and a quiz from this codebase overview:

      The importer normalizes CSV rows, validates required columns, and writes
      accepted records to the staging table.
    expected_behavior: >
      Preserves separate quiz and flashcard contracts. It may share learning
      objectives and a compact knowledge map, but quiz output remains a
      diagnostic assessment with blueprint, answer key, feedback, and its own
      canonical JSON payload.
